[project]
name = "guild"
version = "0.1.0"
description = "Group investing: one decision, executed in every member's own account"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]
agents = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guild"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["guild"]

# Module boundaries are a build-time rule, not a convention. See ADR 0002: this is the
# single check that decides whether this codebase can be split into services later.
[tool.importlinter]
root_package = "guild"

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent"
type = "independence"
modules = [
    "guild.domain.guild",
    "guild.domain.trading",
    "guild.domain.ledger",
    "guild.domain.recon",
]

[[tool.importlinter.contracts]]
name = "Domain never imports adapters, api or agents"
type = "forbidden"
source_modules = ["guild.domain"]
forbidden_modules = ["guild.adapters", "guild.api", "guild.agents"]

[[tool.importlinter.contracts]]
name = "Agents never import the order path"
type = "forbidden"
source_modules = ["guild.agents"]
forbidden_modules = ["guild.domain.trading"]
